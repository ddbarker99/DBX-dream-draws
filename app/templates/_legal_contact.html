<address class="panel" style="font-style:normal;margin:var(--s3) 0">
  <b>{{ config.SITE_NAME }}</b><br>
  {% if config.COMPANY_DETAILS %}{% set parts = config.COMPANY_DETAILS.split('·') %}{{ parts[-1].strip()|replace(', ', '<br>'|safe) }}<br>{% endif %}
  {% if config.SUPPORT_EMAIL %}Email: <a href="mailto:{{ config.SUPPORT_EMAIL }}">{{ config.SUPPORT_EMAIL }}</a>{% else %}<a href="{{ url_for('public.contact') }}">Contact us</a>{% endif %}
</address>
