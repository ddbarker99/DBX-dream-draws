{% set ep = request.endpoint %}
<div class="adminbar" style="align-items:center">
  <img class="adminbadge" src="{{ url_for('static', filename='brand/admin-160.png') }}" alt="Admin">
  <a class="{{ 'on' if ep in ('admin.dashboard','admin.entries','admin.edit_competition','admin.new_competition') }}" href="{{ url_for('admin.dashboard') }}">Competitions</a>
  <a class="{{ 'on' if ep == 'admin.stats' }}" href="{{ url_for('admin.stats') }}">📈 Stats</a>
  <a class="{{ 'on' if ep == 'admin.payouts' }}" href="{{ url_for('admin.payouts') }}">Payouts &amp; prizes</a>
  <a class="{{ 'on' if ep in ('admin.users','admin.user_detail') }}" href="{{ url_for('admin.users') }}">Users</a>
  <a class="{{ 'on' if ep == 'admin.promos' }}" href="{{ url_for('admin.promos') }}">Promo codes</a>
  <a class="{{ 'on' if ep == 'admin.settings' }}" href="{{ url_for('admin.settings') }}">Site settings</a>
</div>
