{% extends "base.html" %}
{% block title %}Choose a new password · {{ config.SITE_NAME }}{% endblock %}
{% block desc %}Choose a new password for your account.{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="form-narrow">
<form class="panel" method="post">
  <h1>Choose a new password</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="field"><label for="pw">New password</label><input id="pw" type="password" name="password" minlength="10" required autocomplete="new-password" aria-describedby="pw-h"><span class="hint" id="pw-h">At least 10 characters.</span></div>
  <button class="btn block" style="margin-top:var(--s4)">Save password</button>
</form>
</div>
{% endblock %}
