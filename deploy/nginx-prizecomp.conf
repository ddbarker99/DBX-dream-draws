# /etc/nginx/sites-available/prizecomp  — then: certbot --nginx -d yourdomain --redirect
# After editing: sudo nginx -t && sudo systemctl reload nginx

# Static files and prize photos are cached by nginx, so the app only builds pages (see docs/CAPACITY.md).
proxy_cache_path /var/cache/nginx/dbx levels=1:2 keys_zone=dbx_static:10m max_size=500m inactive=7d use_temp_path=off;
# Sign-in, sign-up, password reset and admin verification: at most 10 attempts a minute per IP, shared across all
# app workers (the app also limits per account).
limit_req_zone $binary_remote_addr zone=dbx_auth:10m rate=10r/m;

server {
    listen 80;
    server_name dbxdreamdraws.co.uk www.dbxdreamdraws.co.uk;
    client_max_body_size 8M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Shared by every location below.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;      # replaces anything the visitor sent, so it can't be spoofed
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location ~ ^/(static|uploads)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache dbx_static;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }

    location ~ ^/(login|signup|forgot|reset|admin/mfa)(/|$) {
        limit_req zone=dbx_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 60s;
    }
}
