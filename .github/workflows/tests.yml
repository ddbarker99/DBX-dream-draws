name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit and integration tests (draws, payments, limits, postal entries, wallets, permissions…)
        run: python -m pytest -q tests/test_app.py
      - name: Crawl every page as guest, player and admin
        run: python tests/qa_crawl.py
      - name: Concurrency stress (separate processes racing for the same tickets)
        run: |
          python tests/stress_concurrency.py --buyers 24 --tickets 30
          python tests/stress_concurrency.py --buyers 30 --tickets 12
      - name: Performance budgets (page weight, requests, server time)
        run: python tests/perf_budget.py
      - name: Keyboard-only walkthrough and axe-core scan (real browser)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          npm pack axe-core && tar -xzf axe-core-*.tgz package/axe.min.js
          AXE_JS=package/axe.min.js python tests/a11y_keyboard.py
