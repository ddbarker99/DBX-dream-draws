services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SECURE_COOKIES: "1"
    ports:
      - "127.0.0.1:8000:8000"   # only nginx on this server can reach it
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Runs closing, draws, emails, health alerts and fraud checks every 20 seconds, even when nobody is visiting.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["flask", "--app", "wsgi", "run-jobs", "--loop"]
    volumes:
      - ./data:/data
    depends_on:
      - web
